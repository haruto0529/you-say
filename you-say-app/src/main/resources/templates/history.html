<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>クイズ挑戦履歴 - YOU SAY QUIZ</title>

	<script>
		(function () {
			if (localStorage.getItem('quiz_dark_mode') === 'true') {
				document.documentElement.classList.add('dark-mode');
			}
		})();
	</script>

	<link rel="stylesheet" th:href="@{/css/common.css}">
	<style>
		html {
			background: #f0f0f0;
		}

		html.dark-mode {
			background: #1a1a1a;
		}

		body {
			background: transparent;
		}

		.history-container {
			max-width: 800px;
			margin: 40px auto;
			padding: 0 20px 100px;
		}

		.card {
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.14);
			padding: 32px;
			transition: background 0.3s;
		}

		.rate-summary {
			display: inline-block;
			margin-top: 8px;
			padding: 6px 18px;
			border-radius: 20px;
			background: #f5f5f5;
			font-size: 14px;
			color: #555;
		}

		.rate-summary .rate-value {
			font-size: 20px;
			font-weight: 700;
			color: #e8943c;
			margin-left: 6px;
		}

		.history-list {
			display: flex;
			flex-direction: column;
			gap: 16px;
			margin-top: 24px;
		}

		.history-item {
			padding: 16px 0;
			border-bottom: 1px solid #eee;
		}

		.history-item:last-child {
			border-bottom: none;
		}

		.history-date {
			font-size: 12px;
			color: #888;
			margin-bottom: 6px;
		}

		.history-question {
			font-weight: 700;
			font-size: 16px;
			color: #333;
			margin-bottom: 10px;
		}

		.history-detail {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			align-items: center;
			font-size: 14px;
		}

		.detail-label {
			color: #888;
			font-size: 12px;
			margin-right: 2px;
		}

		.result-badge {
			display: inline-block;
			padding: 2px 10px;
			border-radius: 20px;
			font-size: 12px;
			font-weight: 700;
			color: #fff;
		}

		.result-correct {
			background: #4caf50;
		}

		.result-wrong {
			background: #e8453c;
		}

		.empty-message {
			text-align: center;
			padding: 40px 0;
			color: #aaa;
		}

		.empty-message .empty-icon {
			font-size: 40px;
			margin-bottom: 12px;
		}

		.empty-message .empty-text {
			font-size: 15px;
		}

		.empty-message .empty-sub {
			font-size: 13px;
			margin-top: 6px;
			color: #bbb;
		}

		/* ダークモード対応 */
		body.dark-mode {
			color: #eee;
		}

		body.dark-mode .card {
			background: #2a2a2a;
		}

		body.dark-mode .history-item {
			border-bottom-color: #444;
		}

		body.dark-mode .history-question {
			color: #fff;
		}

		body.dark-mode .history-date {
			color: #aaa;
		}

		body.dark-mode .detail-label {
			color: #888;
		}

		body.dark-mode .rate-summary {
			background: #333;
			color: #ccc;
		}

		body.dark-mode .empty-sub {
			color: #666;
		}

		.fixed-bottom-bar {
			position: fixed;
			bottom: 56px;
			left: 0;
			right: 0;
			text-align: center;
			z-index: 100;
			pointer-events: none;
		}

		.fixed-bottom-bar .btn {
			pointer-events: auto;
		}
	</style>
</head>

<body>

	<header th:replace="~{fragments/header :: header}"></header>

	<main class="history-container">
		<div class="card">
			<h2 style="font-family: 'Nunito', sans-serif;">クイズ挑戦履歴</h2>

			<div th:if="${!#lists.isEmpty(historyList)}">
				<div class="rate-summary">
					正答率<span class="rate-value" th:text="${percent} + '%'"></span>
				</div>

				<div class="history-list">
					<div class="history-item" th:each="h : ${historyList}">
						<div class="history-date" th:text="${#temporals.format(h.createdAt, 'yyyy/MM/dd HH:mm')}"></div>
						<div class="history-question" th:text="${h.questionText}"></div>
						<div class="history-detail">
							<span class="detail-label">あなたの回答：</span>
							<span th:text="${h.userAnswer}"></span>
							&nbsp;
							<span class="result-badge" th:classappend="${h.result} ? 'result-correct' : 'result-wrong'"
								th:text="${h.result} ? '正解' : '不正解'"></span>
							&nbsp;
							<span class="detail-label">正解：</span>
							<span th:text="${h.answerText}"></span>
						</div>
					</div>
				</div>
			</div>

			<div th:if="${#lists.isEmpty(historyList)}" class="empty-message">
				<div class="empty-icon">📋</div>
				<div class="empty-text">まだ挑戦履歴がありません</div>
				<div class="empty-sub">クイズに挑戦すると、ここに結果が表示されます</div>
			</div>

		</div>
	</main>

	<div class="fixed-bottom-bar">
		<button type="button" class="btn btn-orange" onclick="history.back()">戻る</button>
	</div>

	<footer th:replace="~{fragments/footer :: footer}"></footer>

	<script>
		window.addEventListener('DOMContentLoaded', () => {
			if (localStorage.getItem('quiz_dark_mode') === 'true') {
				document.body.classList.add('dark-mode');
			}
		});
	</script>
</body>

</html>
